name: Deploy Wiki

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'wiki/**'
  workflow_dispatch:

jobs:
  deploy-wiki:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required to checkout and push to wiki repository
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Checkout wiki repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Copy wiki files
        run: |
          # Copy all markdown files from wiki/ directory to wiki repository
          if [ -d "wiki" ]; then
            cp -r wiki/*.md wiki-repo/ 2>/dev/null || true
            
            # Copy any images or assets
            if [ -d "wiki/images" ]; then
              mkdir -p wiki-repo/images
              cp -r wiki/images/* wiki-repo/images/ 2>/dev/null || true
            fi
          fi
      
      - name: Commit and push to wiki
        run: |
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update wiki from main repository - ${{ github.sha }}"
            git push
            echo "Wiki updated successfully"
          fi
